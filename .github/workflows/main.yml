name: Build KGP QII Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-unsigned-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # បានលុប cache: 'pnpm' ចេញដើម្បីការពារកុំឱ្យទាមទារ pnpm-lock.yaml

      - name: Install Workspace Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build Unsigned iOS Archive
        run: |
          set -o pipefail
          npx expo prebuild --platform ios --clean
          cd ios
          xcodebuild -workspace KGPQII.xcworkspace \
            -scheme KGPQII \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build/KGPQII.xcarchive
        
      - name: Package Unsigned IPA for ESign
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/KGPQII.xcarchive/Products/Applications/*.app Payload/
          zip -r KGPQII_Unsigned.ipa Payload
          rm -rf Payload
          echo "IPA path: ios/KGPQII_Unsigned.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGPQII-Unsigned-IPA
          path: ios/KGPQII_Unsigned.ipa
