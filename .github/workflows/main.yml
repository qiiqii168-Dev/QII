name: Build KGP QII Unsigned iOS IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Extract original project
      - name: Extract KGP V2 Project
        shell: bash
        run: |
          set -euo pipefail

          test -f "KGP V2.zip"

          mkdir -p source

          unzip -q "KGP V2.zip" -d source

          test -f "source/Khmer-Game-Portal/pnpm-workspace.yaml"
          test -f "source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json"

          echo "KGP V2 extracted successfully."

      # 5. Install workspace dependencies
      - name: Install dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile

          echo "Dependencies installed."

      # 6. Configure iOS Bundle ID
      - name: Configure KGP iOS
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          path = "app.json"

          with open(path, "r", encoding="utf-8") as f:
              config = json.load(f)

          expo = config.setdefault("expo", {})
          ios = expo.setdefault("ios", {})

          expo["name"] = "KGP QII"
          expo["slug"] = "kgp-qii"

          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"
          ios["supportsTablet"] = True

          info = ios.setdefault("infoPlist", {})
          info["NSHumanReadableCopyright"] = "Project by Qii Qii"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("App configuration updated.")
          print("Bundle ID:", ios["bundleIdentifier"])
          PY

      # 7. Generate native iOS project
      - name: Generate iOS project
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo prebuild \
            --platform ios \
            --clean \
            --no-install

          test -f ios/Podfile

          echo "Native iOS project generated."

      # 8. Install CocoaPods
      - name: Install CocoaPods
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          pod install

          echo "CocoaPods installed."

      # 9. Build unsigned iOS application
      - name: Build Unsigned iOS App
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          IOS_DIR="$PWD/ios"
          DERIVED_DATA="$RUNNER_TEMP/KGP-DerivedData"

          WORKSPACE=$(find "$IOS_DIR" \
            -maxdepth 1 \
            -name "*.xcworkspace" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace not found."
            exit 1
          fi

          echo "Workspace: $WORKSPACE"

          xcodebuild -list -json -workspace "$WORKSPACE" \
            > "$RUNNER_TEMP/xcode-list.json"

          SCHEME=$(python3 - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "xcode-list.json"
          )

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          schemes = data.get("workspace", {}).get("schemes", [])

          if not schemes:
              raise SystemExit("ERROR: No Xcode scheme found.")

          print(schemes[0])
          PY
          )

          echo "Using scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          echo "Unsigned iOS build completed."

      # 10. Package unsigned IPA
      - name: Package Unsigned IPA
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$RUNNER_TEMP/KGP-DerivedData/Build/Products/Release-iphoneos"

          test -d "$APP_DIR"

          APP_PATH=""

          while IFS= read -r APP; do
            BUNDLE_ID=$(/usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist" 2>/dev/null || true)

            if [ "$BUNDLE_ID" = "com.qiiqii.khmergameport" ]; then
              APP_PATH="$APP"
              break
            fi
          done < <(find "$APP_DIR" -maxdepth 1 -type d -name "*.app")

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: KGP application bundle not found."
            find "$APP_DIR" -maxdepth 2 -print
            exit 1
          fi

          echo "Found app: $APP_PATH"

          mkdir -p output/Payload

          cp -R "$APP_PATH" output/Payload/

          cd output

          zip -qry KGP-QII-Unsigned.ipa Payload

          test -s KGP-QII-Unsigned.ipa

          echo "Unsigned IPA created successfully."

          ls -lh KGP-QII-Unsigned.ipa

      # 11. Upload IPA to GitHub Actions
      - name: Upload KGP QII IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-Unsigned-IPA
          path: source/Khmer-Game-Portal/artifacts/khmer-game-port/output/KGP-QII-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
