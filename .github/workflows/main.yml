
name: Build KGP QII iOS IPA

"on":
  workflow_dispatch:
  push:
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII IPA
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: KGP V2.zip

      - name: Extract original project ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "KGP V2.zip"

          mkdir -p source

          unzip -q "KGP V2.zip" -d source

          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml
          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json

          echo "Project extracted successfully."

      - name: Install workspace dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      - name: Configure KHMER GAME PORT
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$EXPO_TOKEN"

          python - <<'PY'
          import json
          import os

          with open("app.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          expo = config.setdefault("expo", {})

          expo["owner"] = "qiiqii168"
          expo["slug"] = "kgp-qii"

          ios = expo.setdefault("ios", {})

          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"

          info = ios.setdefault("infoPlist", {})
          info["ITSAppUsesNonExemptEncryption"] = False

          # Remove buildNumber because EAS uses remote versioning.
          ios.pop("buildNumber", None)

          with open("app.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          eas_path = "eas.json"

          if os.path.exists(eas_path):
              with open(eas_path, "r", encoding="utf-8") as f:
                  eas = json.load(f)
          else:
              eas = {}

          eas.setdefault("cli", {})
          eas["cli"]["appVersionSource"] = "remote"

          profiles = eas.setdefault("build", {})

          preview = profiles.setdefault("preview", {})
          preview["distribution"] = "internal"

          ios_preview = preview.setdefault("ios", {})
          ios_preview["simulator"] = False

          with open(eas_path, "w", encoding="utf-8") as f:
              json.dump(eas, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Bundle ID:", ios["bundleIdentifier"])
          print("Encryption configured.")
          print("Expo owner: qiiqii168")
          print("Expo slug: kgp-qii")
          print("Preview distribution: internal")
          PY

          pnpm dlx eas-cli@latest init \
            --account qiiqii168 \
            --non-interactive

          pnpm dlx eas-cli@latest project:info

      - name: Verify iOS configuration
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json

          with open("app.json", encoding="utf-8") as f:
              app = json.load(f)["expo"]

          ios = app["ios"]

          assert ios["bundleIdentifier"] == "com.qiiqii.khmergameport"
          assert ios["infoPlist"]["ITSAppUsesNonExemptEncryption"] is False

          print("iOS configuration verified.")
          print("Bundle ID:", ios["bundleIdentifier"])
          PY

      - name: Build iOS Ad-hoc IPA
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting KGP QII iOS IPA build..."

          pnpm dlx eas-cli@latest build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --wait \
            --json > "$RUNNER_TEMP/eas-build.json"

          echo "Build completed. Reading IPA URL..."

          BUILD_URL=$(python - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "eas-build.json"
          )

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          def find_url(obj):
              if isinstance(obj, dict):
                  artifacts = obj.get("artifacts")

                  if isinstance(artifacts, dict):
                      for key in (
                          "buildUrl",
                          "applicationArchiveUrl"
                      ):
                          value = artifacts.get(key)
                          if value:
                              return value

                  for value in obj.values():
                      result = find_url(value)
                      if result:
                          return result

              elif isinstance(obj, list):
                  for item in obj:
                      result = find_url(item)
                      if result:
                          return result

              return None

          url = find_url(data)

          if not url:
              raise SystemExit("IPA download URL not found.")

          print(url)
          PY
          )

          mkdir -p output

          curl --fail --location --retry 3 \
            "$BUILD_URL" \
            --output output/KGP-QII.ipa

          test -s output/KGP-QII.ipa

          echo "IPA downloaded successfully."

          ls -lh output/KGP-QII.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-iOS-IPA
          path: source/Khmer-Game-Portal/artifacts/khmer-game-port/output/KGP-QII.ipa
          if-no-files-found: error
          retention-days: 7
