
name: Build SVP GAME IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svp-game-build
  cancel-in-progress: false

jobs:
  build:
    name: Build SVP GAME
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name 'SVP-GAME-Source-*.zip' -print -quit)
          test -n "$ZIP" || {
            echo "::error::Source ZIP not found"
            exit 1
          }

          mkdir -p source
          unzip -q "$ZIP" -d source

          SCRIPT=$(find source -name build_ipa.sh -print -quit)
          test -n "$SCRIPT" || exit 1

          ROOT=$(dirname "$SCRIPT")
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Check Game Files URL
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL }}
        run: |
          if [ -z "$GAME_FILES_URL" ]; then
            echo "::error::Set GAME_FILES_URL in GitHub Secrets"
            exit 1
          fi

      - name: Download Game Files
        env:
          GAME_FILES_URL: ${{ secrets.GAME_FILES_URL }}
        run: |
          cd "$SOURCE_ROOT/app"
          mkdir -p Build/Inputs
          python3 Scripts/fetch_game_files.py \
            --server "$GAME_FILES_URL" \
            --out Build/Inputs/mirror

      - name: Verify Game Files
        run: |
          cd "$SOURCE_ROOT/app"
          python3 Scripts/check_game_files.py \
            --mirror Build/Inputs/mirror

      - name: Prepare engine and generated sources
        run: |
          cd "$SOURCE_ROOT/app"
          python3 Scripts/prepare.py \
            --mirror Build/Inputs/mirror

      - name: Generate Xcode project
        run: |
          cd "$SOURCE_ROOT/app"
          xcodegen generate

      - name: Configure SVP GAME
        run: |
          cd "$SOURCE_ROOT/app"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName SVP GAME" App/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :PGDefaultAssetServer $GAME_FILES_URL" App/Info.plist

      - name: Build iOS application
        run: |
          cd "$SOURCE_ROOT/app"

          xcodebuild \
            -project PlayGTA5Native.xcodeproj \
            -scheme PlayGTA5Native \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=App/Free.entitlements \
            build

      - name: Package unsigned IPA
        run: |
          cd "$SOURCE_ROOT/app"

          APP="Build/Release/Build/Products/Release-iphoneos/PlayGTA5Native.app"

          test -d "$APP" || {
            echo "::error::Built app not found"
            exit 1
          }

          mkdir -p "$GITHUB_WORKSPACE/output/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/output/Payload/SVP GAME.app"

          cd "$GITHUB_WORKSPACE/output"
          zip -qry SVP-GAME.ipa Payload

      - name: Upload SVP GAME IPA
        uses: actions/upload-artifact@v4
        with:
          name: SVP-GAME-IPA
          path: output/SVP-GAME.ipa
          if-no-files-found: error
          retention-days: 14
