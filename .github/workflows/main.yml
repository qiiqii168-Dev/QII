
name: Build SVP GAME IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build_ipa.sh'
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: svp-game-build
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f build_ipa.sh || {
            echo "ERROR: build_ipa.sh not found"
            exit 1
          }
          test -f app/project.yml || {
            echo "ERROR: app/project.yml not found"
            exit 1
          }
          test -f app/Scripts/prepare.py || {
            echo "ERROR: prepare.py not found"
            exit 1
          }

      - name: Install build tools
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Set SVP GAME name
        run: |
          if [ -f app/App/Info.plist ]; then
            /usr/libexec/PlistBuddy \
              -c 'Set :CFBundleDisplayName SVP GAME' \
              app/App/Info.plist || true
          fi

      - name: Build unsigned IPA
        env:
          PYTHON: /usr/bin/python3
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh --free

          IPA=$(find . -maxdepth 3 -name '*.ipa' -print -quit)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not generated"
            exit 1
          fi

          mkdir -p output
          cp "$IPA" output/SVP-GAME.ipa

      - name: Upload SVP GAME IPA
        uses: actions/upload-artifact@v4
        with:
          name: SVP-GAME-unsigned-IPA
          path: output/SVP-GAME.ipa
          if-no-files-found: error
          retention-days: 14
