
name: Build KGP QII Unsigned iOS IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract KGP V2 Project
        shell: bash
        run: |
          set -euo pipefail

          test -f "KGP V2.zip"
          mkdir -p source
          unzip -q "KGP V2.zip" -d source

          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml
          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json

          echo "KGP V2 extracted successfully."

      - name: Install dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      - name: Configure KGP iOS
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open("app.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          expo = config.setdefault("expo", {})
          ios = expo.setdefault("ios", {})

          expo["name"] = "KGP QII"
          expo["slug"] = "kgp-qii"
          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"
          ios["supportsTablet"] = True

          info = ios.setdefault("infoPlist", {})
          info["NSHumanReadableCopyright"] = "Project by Qii Qii"

          with open("app.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Bundle ID:", ios["bundleIdentifier"])
          PY

      - name: Generate iOS project
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo prebuild \
            --platform ios \
            --clean \
            --no-install

          test -f ios/Podfile
          echo "iOS project generated."

      - name: Install CocoaPods
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          pod install
          echo "Pods installed."

      - name: Discover Xcode Project and Schemes
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode workspaces ==="
          find . -maxdepth 2 -name "*.xcworkspace" -print

          echo "=== Xcode projects ==="
          find . -maxdepth 2 -name "*.xcodeproj" -print

          WORKSPACE=$(find . -maxdepth 2 \
            -name "*.xcworkspace" \
            ! -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No Xcode workspace found."
            exit 1
          fi

          echo "WORKSPACE=$PWD/${WORKSPACE#./}" >> "$GITHUB_ENV"

          xcodebuild -list -workspace "$WORKSPACE"

          xcodebuild -list -json -workspace "$WORKSPACE" \
            > "$RUNNER_TEMP/kgp-xcode-list.json"

          python3 - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "kgp-xcode-list.json"
          )

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          schemes = data.get("workspace", {}).get("schemes", [])

          print("Available schemes:", schemes)

          if not schemes:
              raise SystemExit("ERROR: No Xcode schemes found.")

          # Prefer an application scheme instead of a framework scheme.
          preferred = [
              s for s in schemes
              if "app" in s.lower()
              or "khmer" in s.lower()
              or "game" in s.lower()
              or "kgp" in s.lower()
          ]

          selected = preferred[0] if preferred else schemes[0]

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"KGP_SCHEME={selected}\n")

          print("Selected scheme:", selected)
          PY

      - name: Build Unsigned iOS App
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/KGP-DerivedData"

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $KGP_SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$KGP_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          echo "=== Build products ==="
          find "$DERIVED_DATA/Build/Products" \
            -maxdepth 5 -name "*.app" -print

      - name: Package Unsigned IPA
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/KGP-DerivedData"
          PRODUCTS="$DERIVED_DATA/Build/Products"

          test -d "$PRODUCTS"

          echo "Searching for application bundle..."

          APP_PATH=""

          while IFS= read -r APP; do
            BUNDLE_ID=$(/usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP/Info.plist" 2>/dev/null || true)

            echo "Found candidate: $APP"
            echo "Bundle ID: $BUNDLE_ID"

            if [ "$BUNDLE_ID" = "com.qiiqii.khmergameport" ]; then
              APP_PATH="$APP"
              break
            fi
          done < <(
            find "$PRODUCTS" \
              -type d \
              -name "*.app" \
              ! -path "*/XCFrameworkIntermediates/*"
          )

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: KGP app bundle not found."
            echo "All build products:"
            find "$PRODUCTS" -maxdepth 6 -print
            exit 1
          fi

          echo "Selected app: $APP_PATH"

          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/

          cd output

          zip -qry KGP-QII-Unsigned.ipa Payload

          test -s KGP-QII-Unsigned.ipa

          echo "Unsigned IPA created:"
          ls -lh KGP-QII-Unsigned.ipa

      - name: Upload KGP QII IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-Unsigned-IPA
          path: source/Khmer-Game-Portal/artifacts/khmer-game-port/output/KGP-QII-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
