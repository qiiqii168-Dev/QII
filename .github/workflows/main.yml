name: Build KGP QII iOS IPA

"on":
  workflow_dispatch:
  push:
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build KGP QII IPA
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract original project ZIP
        shell: bash
        run: |
          set -e

          test -f "KGP V2.zip"

          mkdir -p source

          unzip -q "KGP V2.zip" -d source

          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml
          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json

          echo "Project extracted successfully."

      - name: Install workspace dependencies
        working-directory: source/Khmer-Game-Portal
        run: |
          pnpm install --no-frozen-lockfile

      - name: Configure Expo project
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -e

          test -n "$EXPO_TOKEN"

          python - <<'PY'
          import json
          import os

          app_path = "app.json"

          with open(app_path, "r", encoding="utf-8") as f:
              app = json.load(f)

          expo = app.setdefault("expo", {})
          expo["owner"] = "qiiqii168"
          expo["slug"] = "kgp-qii"

          with open(app_path, "w", encoding="utf-8") as f:
              json.dump(app, f, indent=2, ensure_ascii=False)
              f.write("\n")

          eas_path = "eas.json"

          if os.path.exists(eas_path):
              with open(eas_path, "r", encoding="utf-8") as f:
                  config = json.load(f)
          else:
              config = {}

          profiles = config.setdefault("build", {})

          profiles["preview"] = {
              "distribution": "internal",
              "ios": {
                  "simulator": False
              }
          }

          with open(eas_path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Expo owner: qiiqii168")
          print("Project slug: kgp-qii")
          print("Distribution: internal")
          PY

          pnpm dlx eas-cli@latest init \
            --account qiiqii168 \
            --non-interactive

      - name: Build iOS Ad-hoc IPA
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          pnpm dlx eas-cli@latest build \
            --platform ios \
            --profile preview \
            --wait \
            --non-interactive \
            --json > "$RUNNER_TEMP/eas-build.json"

          BUILD_URL=$(python - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "eas-build.json"
          )

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          def find_url(obj):
              if isinstance(obj, dict):
                  artifacts = obj.get("artifacts")

                  if isinstance(artifacts, dict):
                      for key in (
                          "buildUrl",
                          "applicationArchiveUrl"
                      ):
                          value = artifacts.get(key)
                          if value:
                              return value

                  for value in obj.values():
                      result = find_url(value)
                      if result:
                          return result

              elif isinstance(obj, list):
                  for item in obj:
                      result = find_url(item)
                      if result:
                          return result

              return None

          url = find_url(data)

          if not url:
              raise SystemExit("IPA download URL not found.")

          print(url)
          PY
          )

          mkdir -p output

          curl -fL "$BUILD_URL" \
            -o output/KGP-QII.ipa

          test -s output/KGP-QII.ipa

          echo "IPA downloaded successfully."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-iOS-IPA
          path: source/Khmer-Game-Portal/artifacts/khmer-game-port/output/KGP-QII.ipa
          if-no-files-found: error
          retention-days: 7
