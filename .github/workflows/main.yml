name: Build KGP QII IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q "KGP V2.zip" -d kgp-source
          test -f kgp-source/Khmer-Game-Portal/pnpm-lock.yaml
          test -f kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port/eas.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: kgp-source/Khmer-Game-Portal
        run: pnpm install --frozen-lockfile

      - name: Build iOS
        working-directory: kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port
        run: pnpm dlx eas-cli@latest build --platform ios --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download IPA
        working-directory: kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port
        run: pnpm dlx eas-cli@latest build:download --latest --platform ios --path ./KGP-QII.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-IPA
          path: kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port/KGP-QII.ipa
          if-no-files-found: error
