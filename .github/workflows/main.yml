name: Build KGP QII iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'KGP_QII_NEW_EAS_PROJECT.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract original project ZIP
        run: |
          test -f 'KGP_QII_NEW_EAS_PROJECT.zip'
          mkdir -p source
          unzip -q 'KGP_QII_NEW_EAS_PROJECT.zip' -d source
          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml
          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json

      - name: Install workspace dependencies
        working-directory: source/Khmer-Game-Portal
        run: pnpm install --no-frozen-lockfile

      - name: Configure new EAS project under personal account
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          pnpm dlx eas-cli@latest init --account qiqii168 --non-interactive

      - name: Build iOS IPA with EAS
        id: eas-build
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          pnpm dlx eas-cli@latest build --platform ios --profile production --wait --non-interactive --json > "$RUNNER_TEMP/eas-build.json"
          BUILD_ID=$(python - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'], 'eas-build.json')
          data=json.load(open(p))
          if isinstance(data, list):
              data=data[-1]
          if isinstance(data, dict) and 'build' in data and isinstance(data['build'], dict):
              data=data['build']
          build_id=data.get('id') if isinstance(data, dict) else None
          if not build_id:
              raise SystemExit('Could not read EAS build ID from JSON output')
          print(build_id)
          PY
          )
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          pnpm dlx eas-cli@latest build:download --build-id "$BUILD_ID" --non-interactive

      - name: Find IPA
        id: ipa
        run: |
          IPA_PATH=$(find source/Khmer-Game-Portal/artifacts/khmer-game-port -type f -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            IPA_PATH=$(find . -type f -name '*.ipa' -print -quit)
          fi
          test -n "$IPA_PATH"
          mkdir -p output
          cp "$IPA_PATH" output/KGP-QII.ipa
          echo "path=output/KGP-QII.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-iOS-IPA
          path: output/KGP-QII.ipa
          if-no-files-found: error
          retention-days: 7
