name: Build KGP QII Unsigned iOS IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Extract project
      - name: Extract KGP V2 Project
        shell: bash
        run: |
          set -euo pipefail
          test -f "KGP V2.zip"
          mkdir -p source
          unzip -q "KGP V2.zip" -d source
          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml
          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json
          echo "KGP project extracted."

      # 5. Install dependencies
      - name: Install dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      # 6. Configure app & eas.json for local offline build
      - name: Configure KGP iOS & EAS
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open("app.json", encoding="utf-8") as f:
              config = json.load(f)
          expo = config.setdefault("expo", {})
          ios = expo.setdefault("ios", {})
          expo["name"] = "KGP QII"
          expo["slug"] = "kgp-qii"
          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"
          ios["supportsTablet"] = True
          info = ios.setdefault("infoPlist", {})
          info["NSHumanReadableCopyright"] = "Project by Qii Qii"
          with open("app.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("Bundle ID configured successfully.")
          PY

          cat << 'EOF' > eas.json
          {
            "cli": {
              "version": ">= 12.0.0"
            },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal"
              },
              "preview": {
                "distribution": "internal"
              },
              "production": {}
            }
          }
          EOF
          echo "eas.json created."

      # 7. Install EAS CLI globally
      - name: Install EAS CLI
        shell: bash
        run: npm install -g eas-cli

      # 8. Build using EAS Local Build with dummy token env to bypass login prompt
      - name: Build with EAS Local
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: "dummy_token_to_bypass_login_check_on_ci"
          CI: "1"
        shell: bash
        run: |
          set -euo pipefail
          # Running local build targeting simulator/development profile
          eas build --platform ios --profile development --local --non-interactive

          echo "Finding built artifacts..."
          find . -name "*.app" -o -name "*.ipa"

      # 9. Package unsigned IPA from EAS output
      - name: Package Unsigned IPA
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail
          
          APP_PATH=$(find . -maxdepth 4 -type d -name "*.app" ! -path "*/Pods/*" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Searching for IPA..."
            find . -maxdepth 4 -name "*.ipa"
            exit 1
          fi

          echo "Found app bundle: $APP_PATH"
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -qry KGP-QII-Unsigned.ipa Payload
          test -s KGP-QII-Unsigned.ipa
          echo "Unsigned IPA successfully created via EAS."
          ls -lh KGP-QII-Unsigned.ipa

      # 10. Upload IPA
      - name: Upload KGP QII IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-Unsigned-IPA
          path: source/Khmer-Game-Portal/artifacts/khmer-game-port/output/KGP-QII-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
