name: Build KGP QII iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract KGP project
        run: |
          unzip -q "KGP V2.zip" -d kgp-source
          test -f kgp-source/Khmer-Game-Portal/pnpm-lock.yaml
          test -f kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port/eas.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: kgp-source/Khmer-Game-Portal
        run: pnpm install --frozen-lockfile

      - name: Build iOS IPA
        working-directory: kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port
        run: pnpm dlx eas-cli@latest build --platform ios --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
