name: Build KGP QII Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      # 4. Extract Project
      - name: Extract KGP V2 Project
        shell: bash
        run: |
          set -euo pipefail

          test -f "KGP V2.zip"

          mkdir -p source

          unzip -q "KGP V2.zip" -d source

          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml

          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json

          echo "KGP project extracted successfully."

      # 5. Install Dependencies
      - name: Install Dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile

          echo "Dependencies installed."

      # 6. Configure KGP QII
      - name: Configure KGP QII
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          path = "app.json"

          with open(path, encoding="utf-8") as f:
              config = json.load(f)

          expo = config.setdefault("expo", {})
          ios = expo.setdefault("ios", {})

          expo["name"] = "KGP QII"
          expo["slug"] = "kgp-qii"

          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"
          ios["supportsTablet"] = True

          info = ios.setdefault("infoPlist", {})

          info["NSHumanReadableCopyright"] = "Project by Qii Qii"

          # Preserve existing splash configuration.

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("KGP QII configured.")
          PY

      # 7. Generate iOS Project
      - name: Generate iOS Project
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo prebuild \
            --platform ios \
            --clean

          test -f ios/Podfile

          echo "iOS project generated."

      # 8. Check Storyboards
      - name: Check Storyboards
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking storyboard files..."

          find ios -name "*.storyboard" -print

          echo "Storyboard check completed."

      # 9. Install CocoaPods
      - name: Install CocoaPods
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          pod deintegrate || true

          rm -rf Pods

          pod install --repo-update

          echo "CocoaPods installation completed."

      # 10. Check Expo Configuration
      - name: Check Expo Configuration
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "use_expo_modules!" Podfile; then
            echo "ERROR: Expo autolinking is missing from Podfile."
            exit 1
          fi

          if ! grep -q "ExpoModulesCore" Podfile.lock; then
            echo "ERROR: ExpoModulesCore is missing from Podfile.lock."
            exit 1
          fi

          echo "Expo configuration checked."

      # 11. Build iOS Device App
      - name: Build Unsigned iOS App
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios \
            -maxdepth 2 \
            -name "*.xcworkspace" \
            ! -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace not found."
            exit 1
          fi

          WORKSPACE="$PWD/$WORKSPACE"

          SCHEME=$(xcodebuild \
            -list \
            -workspace "$WORKSPACE" \
            -json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          schemes = data.get('workspace', {}).get('schemes', [])
          print('KGPQII' if 'KGPQII' in schemes else schemes[0])
          ")

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Xcode scheme not found."
            exit 1
          fi

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"

          NODE_PATH=$(command -v node)

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            NODE_BINARY="$NODE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          echo "iOS build completed."

      # 12. Package IPA
      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP_PATH=$(find "$PRODUCTS" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iOS app not found."
            exit 1
          fi

          echo "Found app: $APP_PATH"

          OUTPUT="$GITHUB_WORKSPACE/output"

          mkdir -p "$OUTPUT/Payload"

          cp -R "$APP_PATH" "$OUTPUT/Payload/"

          cd "$OUTPUT"

          zip -qry KGP-QII-Unsigned.ipa Payload

          test -s KGP-QII-Unsigned.ipa

          echo "Unsigned IPA created successfully."

      # 13. Upload IPA
      - name: Upload KGP QII IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-Unsigned-IPA
          path: output/KGP-QII-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
