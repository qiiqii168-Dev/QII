name: Build KGP QII Unsigned iOS IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII Unsigned IPA

    runs-on: macos-15

    timeout-minutes: 120

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      # 5. Check ZIP
      - name: Check Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "KGP V2.zip"

          mkdir -p source

          unzip -q "KGP V2.zip" -d source

          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml

          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json

          echo "Project ZIP verified."

      # 6. Install dependencies
      - name: Install Dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile

          echo "Dependencies installed."

      # 7. Verify Expo
      - name: Verify Expo Dependencies
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          node -e "
          const p = require('./package.json');

          if (!p.dependencies?.expo && !p.devDependencies?.expo) {
            console.error('Expo dependency is missing.');
            process.exit(1);
          }

          console.log('Expo dependency found.');
          "

          pnpm exec expo --version

      # 8. Configure App
      - name: Configure KGP QII
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          path = "app.json"

          with open(path, encoding="utf-8") as f:
              config = json.load(f)

          expo = config.setdefault("expo", {})
          ios = expo.setdefault("ios", {})

          expo["name"] = "KGP QII"
          expo["slug"] = "kgp-qii"

          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"
          ios["supportsTablet"] = True

          info = ios.setdefault("infoPlist", {})

          info["NSHumanReadableCopyright"] = "Project by Qii Qii"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("App configuration completed.")
          PY

      # 9. Generate iOS project
      - name: Generate iOS Project
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo prebuild --platform ios

          test -f ios/Podfile

          test -d ios

          echo "iOS project generated."

      # 10. Check Expo Modules
      - name: Verify Expo Modules
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          node -e "
          const fs = require('fs');

          const p = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          if (!p.dependencies?.expo &&
              !p.devDependencies?.expo) {
            throw new Error('Expo package missing');
          }

          console.log('Expo package OK');
          "

          grep -n "use_expo_modules!" ios/Podfile

      # 11. Install CocoaPods
      - name: Install CocoaPods
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          pod --version

          pod install --repo-update

          test -d Pods

          test -f Podfile.lock

          echo "CocoaPods installed."

      # 12. Verify Native Modules
      - name: Verify Native Modules
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "ExpoModulesCore" Podfile.lock; then
            echo "ERROR: ExpoModulesCore not found in Podfile.lock"
            exit 1
          fi

          if ! grep -q "react-native-keyboard-controller" Podfile.lock; then
            echo "ERROR: Keyboard Controller missing from Podfile.lock"
            exit 1
          fi

          echo "Native modules verified."

      # 13. Find Workspace
      - name: Find Xcode Workspace
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios \
            -maxdepth 2 \
            -name "*.xcworkspace" \
            ! -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace not found."
            exit 1
          fi

          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"

          echo "Workspace: $WORKSPACE"

      # 14. Find Scheme
      - name: Find Xcode Scheme
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME=$(xcodebuild -list \
            -workspace "$WORKSPACE" \
            -json | python3 -c "
          import json,sys

          data=json.load(sys.stdin)

          schemes=data.get('workspace',{}).get('schemes',[])

          preferred=['KGPQII','KGP QII']

          for name in preferred:
              if name in schemes:
                  print(name)
                  break
          else:
              if schemes:
                  print(schemes[0])
              else:
                  raise SystemExit('No Xcode scheme found')
          ")

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "Using scheme: $SCHEME"

      # 15. Build iOS Device App
      - name: Build Unsigned iOS App
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"

          NODE_PATH=$(command -v node)

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            NODE_BINARY="$NODE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          echo "iOS Device Build completed."

      # 16. Package IPA
      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP_PATH=$(find "$PRODUCTS" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iOS APP not found."
            exit 1
          fi

          echo "Found APP: $APP_PATH"

          mkdir -p output/Payload

          cp -R "$APP_PATH" output/Payload/

          cd output

          zip -qry KGP-QII-Unsigned.ipa Payload

          test -f KGP-QII-Unsigned.ipa

          echo "IPA successfully created."

      # 17. Upload IPA
      - name: Upload KGP QII IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-Unsigned-IPA
          path: output/KGP-QII-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
