name: Build KGP QII IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract KGP Project
        run: |
          unzip -q "KGP V2.zip" -d kgp-source
          test -f kgp-source/Khmer-Game-Portal/package.json
          test -f kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port/eas.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: kgp-source/Khmer-Game-Portal
        run: pnpm install --no-frozen-lockfile

      - name: Initialize EAS Project
        working-directory: kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: pnpm dlx eas-cli@latest init --account qiqii168 --non-interactive

      - name: Build iOS IPA
        working-directory: kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli@latest build \
            --platform ios \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));

          function findUrl(obj) {
            if (!obj || typeof obj !== 'object') return null;
            if (typeof obj.buildUrl === 'string') return obj.buildUrl;
            for (const value of Object.values(obj)) {
              const result = findUrl(value);
              if (result) return result;
            }
            return null;
          }

          (async () => {
            const url = findUrl(data);
            if (!url) throw new Error('IPA URL not found');

            const response = await fetch(url);
            if (!response.ok) throw new Error('IPA download failed');

            const buffer = Buffer.from(await response.arrayBuffer());
            if (buffer.length < 1000) throw new Error('Invalid IPA file');

            fs.writeFileSync('KGP-QII.ipa', buffer);
            console.log('IPA downloaded successfully');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-IPA
          path: kgp-source/Khmer-Game-Portal/artifacts/khmer-game-port/KGP-QII.ipa
          if-no-files-found: error
          retention-days: 7
