name: Build KGP QII Unsigned iOS IPA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Extract original project
      - name: Extract KGP V2 Project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "KGP V2.zip" ]; then
            echo "::error::KGP V2.zip not found!"
            exit 1
          fi

          mkdir -p source
          unzip -q "KGP V2.zip" -d source

          PROJECT_DIR="source/Khmer-Game-Portal"

          test -f "$PROJECT_DIR/pnpm-workspace.yaml"
          test -f "$PROJECT_DIR/pnpm-lock.yaml"
          test -f "$PROJECT_DIR/artifacts/khmer-game-port/package.json"
          test -f "$PROJECT_DIR/artifacts/khmer-game-port/app.json"
          test -f "$PROJECT_DIR/artifacts/khmer-game-port/modules/gta-engine/GTAEngine.podspec"

          echo "KGP project extracted successfully."

      # 5. Install workspace dependencies
      - name: Install Dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --frozen-lockfile

          echo "Dependencies installed."

      # 6. Configure KGP QII
      - name: Configure KGP QII
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open("app.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          expo = config.setdefault("expo", {})
          ios = expo.setdefault("ios", {})

          expo["name"] = "KGP QII"
          expo["slug"] = "kgp-qii"

          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"
          ios["supportsTablet"] = True

          info = ios.setdefault("infoPlist", {})
          info["NSHumanReadableCopyright"] = "Project by Qii Qii"

          # Preserve all original plugins and splash configuration.
          with open("app.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("KGP QII configured.")
          PY

      # 7. Generate iOS native project
      - name: Generate iOS Project
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        env:
          EXPO_USE_PRECOMPILED_MODULES: "0"
          RCT_USE_PREBUILT_RNCORE: "0"
        run: |
          set -euo pipefail

          pnpm exec expo prebuild --platform ios --clean

          test -f ios/Podfile

          echo "iOS project generated."

      # 8. Install CocoaPods
      - name: Install CocoaPods
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        env:
          EXPO_USE_PRECOMPILED_MODULES: "0"
          RCT_USE_PREBUILT_RNCORE: "0"
        run: |
          set -euo pipefail

          node --version
          ruby --version
          pod --version

          rm -rf Pods

          EXPO_USE_PRECOMPILED_MODULES=0 \
          RCT_USE_PREBUILT_RNCORE=0 \
          pod install --repo-update

          test -f Pods/Manifest.lock

          echo "CocoaPods installed successfully."

      # 9. Verify Expo and GTAEngine
      - name: Verify Native Modules
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "ExpoModulesCore" Podfile.lock; then
            echo "::error::ExpoModulesCore missing!"
            exit 1
          fi

          if ! grep -q "GTAEngine" Podfile.lock; then
            echo "::error::GTAEngine missing!"
            exit 1
          fi

          echo "Expo and GTAEngine detected."

      # 10. Build unsigned iPhoneOS application
      - name: Build Unsigned iOS App
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        env:
          EXPO_USE_PRECOMPILED_MODULES: "0"
          RCT_USE_PREBUILT_RNCORE: "0"
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios \
            -maxdepth 2 \
            -name "*.xcworkspace" \
            ! -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "::error::Xcode workspace not found!"
            exit 1
          fi

          WORKSPACE="$PWD/$WORKSPACE"

          echo "Workspace: $WORKSPACE"

          xcodebuild -list -workspace "$WORKSPACE"

          SCHEME=$(xcodebuild \
            -list \
            -workspace "$WORKSPACE" \
            -json | python3 -c "
          import sys, json

          data = json.load(sys.stdin)
          schemes = data.get('workspace', {}).get('schemes', [])

          if not schemes:
              raise SystemExit('No Xcode scheme found')

          print(schemes[0])
          ")

          echo "Scheme: $SCHEME"

          DERIVED_DATA="$RUNNER_TEMP/KGPQII-DerivedData"
          NODE_PATH=$(command -v node)

          EXPO_USE_PRECOMPILED_MODULES=0 \
          RCT_USE_PREBUILT_RNCORE=0 \
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            NODE_BINARY="$NODE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          echo "iOS build completed."

      # 11. Package IPA
      - name: Package Unsigned IPA
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/KGPQII-DerivedData/Build/Products/Release-iphoneos"

          APP_PATH=$(find "$PRODUCTS" \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "::error::iOS app not found!"
            exit 1
          fi

          echo "Found app: $APP_PATH"

          rm -rf output

          mkdir -p output/Payload

          ditto "$APP_PATH" \
            "output/Payload/$(basename "$APP_PATH")"

          cd output

          zip -qry KGP-QII-Unsigned.ipa Payload

          test -s KGP-QII-Unsigned.ipa

          echo "Unsigned IPA created successfully."

      # 12. Upload IPA
      - name: Upload KGP QII IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-Unsigned-IPA
          path: source/Khmer-Game-Portal/artifacts/khmer-game-port/output/KGP-QII-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
