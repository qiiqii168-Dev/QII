
name: Build SVP GAME IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: svp-game-build
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Checking source files..."

          if [ ! -f build_ipa.sh ]; then
            echo "::error::build_ipa.sh not found in repository root"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Build script found!"

      - name: Install dependencies
        run: |
          brew install xcodegen
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        run: |
          if [ -f app/project.yml ]; then
            cd app
            xcodegen generate
            cd ..
          fi

      - name: Build SVP GAME
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh --help || true
          ./build_ipa.sh

      - name: Find generated IPA
        run: |
          mkdir -p output

          IPA=$(find . \
            -type f \
            -name "*.ipa" \
            -not -path "./output/*" \
            -print -quit)

          if [ -z "$IPA" ]; then
            echo "::error::No IPA file generated"
            exit 1
          fi

          cp "$IPA" output/SVP-GAME.ipa
          ls -lh output/

      - name: Upload SVP GAME IPA
        uses: actions/upload-artifact@v4
        with:
          name: SVP-GAME-unsigned-IPA
          path: output/SVP-GAME.ipa
          if-no-files-found: error
          retention-days: 14
