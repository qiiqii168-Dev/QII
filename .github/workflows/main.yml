name: Build KGP QII Unsigned iOS IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "KGP V2.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: kgp-qii-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Build KGP QII Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 4. Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # 5. Extract project
      - name: Extract KGP V2 Project
        shell: bash
        run: |
          set -euo pipefail

          test -f "KGP V2.zip"

          mkdir -p source

          unzip -q "KGP V2.zip" -d source

          test -f source/Khmer-Game-Portal/pnpm-workspace.yaml

          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/package.json

          test -f source/Khmer-Game-Portal/artifacts/khmer-game-port/app.json

          echo "KGP project extracted successfully."

      # 6. Install dependencies
      - name: Install Dependencies
        working-directory: source/Khmer-Game-Portal
        shell: bash
        run: |
          set -euo pipefail

          pnpm install \
            --no-frozen-lockfile \
            --config.frozen-lockfile=false

          echo "Dependencies installed successfully."

      # 7. Verify Expo
      - name: Verify Expo Dependencies
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo --version

          node -e "
          const p = require('./package.json');
          console.log('App:', p.name);
          console.log('Expo:', p.dependencies?.expo || 'Not declared');
          console.log('React Native:', p.dependencies?.['react-native'] || 'Not declared');
          console.log('WebView:', p.dependencies?.['react-native-webview'] || 'Not declared');
          "

          echo "Expo dependencies verified."

      # 8. Configure KGP QII
      - name: Configure KGP QII
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          path = "app.json"

          with open(path, encoding="utf-8") as f:
              config = json.load(f)

          expo = config.setdefault("expo", {})
          ios = expo.setdefault("ios", {})

          expo["name"] = "KGP QII"
          expo["slug"] = "kgp-qii"

          ios["bundleIdentifier"] = "com.qiiqii.khmergameport"
          ios["supportsTablet"] = True

          info = ios.setdefault("infoPlist", {})

          info["NSHumanReadableCopyright"] = "Project by Qii Qii"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("KGP QII configured successfully.")
          PY

      # 9. Generate iOS project
      - name: Generate iOS Project
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo prebuild --platform ios --clean

          test -f ios/Podfile

          echo "iOS project generated successfully."

      # 10. Verify Expo native modules
      - name: Verify Native Modules
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          grep -n "use_expo_modules" ios/Podfile

          echo "Expo autolinking configuration found."

      # 11. Install CocoaPods
      - name: Install CocoaPods
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port/ios
        shell: bash
        run: |
          set -euo pipefail

          pod install --repo-update

          test -f Pods/Manifest.lock

          echo "CocoaPods installed successfully."

      # 12. Build unsigned iOS app
      - name: Build Unsigned iOS App
        working-directory: source/Khmer-Game-Portal/artifacts/khmer-game-port
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE=$(find ios -maxdepth 3 \
            -name "*.xcworkspace" \
            ! -path "*/Pods/*" \
            -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace not found."
            exit 1
          fi

          WORKSPACE="$PWD/$WORKSPACE"

          SCHEME=$(xcodebuild \
            -list \
            -workspace "$WORKSPACE" \
            -json | python3 -c "
          import sys, json

          data = json.load(sys.stdin)

          schemes = data.get('workspace', {}).get('schemes', [])

          if 'KGPQII' in schemes:
              print('KGPQII')
          elif schemes:
              print(schemes[0])
          else:
              raise SystemExit('No Xcode scheme found')
          ")

          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"

          NODE_PATH=$(command -v node)

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            NODE_BINARY="$NODE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          echo "Unsigned iOS build completed."

      # 13. Package IPA
      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP_PATH=$(find "$PRODUCTS" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: iOS app not found."
            exit 1
          fi

          echo "Found app: $APP_PATH"

          rm -rf output

          mkdir -p output/Payload

          cp -R "$APP_PATH" output/Payload/

          cd output

          zip -qry KGP-QII-Unsigned.ipa Payload

          test -s KGP-QII-Unsigned.ipa

          echo "IPA packaged successfully."

      # 14. Upload IPA
      - name: Upload KGP QII IPA
        uses: actions/upload-artifact@v4
        with:
          name: KGP-QII-Unsigned-IPA
          path: output/KGP-QII-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
