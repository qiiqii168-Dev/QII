name: Build SVP GAME IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svp-game-build
  cancel-in-progress: false

jobs:
  build:
    name: Build SVP GAME
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name 'SVP-GAME-Source-*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "::error::SVP GAME Source ZIP not found"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          SCRIPT=$(find source -name build_ipa.sh -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "::error::build_ipa.sh not found"
            exit 1
          fi

          ROOT=$(dirname "$SCRIPT")
          echo "SOURCE_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Download GTA5 Game Data
        run: |
          set -e

          # ⚠️ ប្ដូរ USERNAME និង REPO_NAME ឱ្យត្រូវនឹង GitHub របស់អ្នក រួចយក GTA5Webport.zip ទៅ Upload ទុកក្នុង GitHub Release
          URL="https://github.com/USERNAME/REPO_NAME/releases/download/v1.0.0/GTA5Webport.zip"

          mkdir -p "$RUNNER_TEMP/game"
          cd "$RUNNER_TEMP/game"

          curl -fL \
            --retry 3 \
            --retry-delay 10 \
            --connect-timeout 60 \
            --max-time 14400 \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -A "Mozilla/5.0" \
            "$URL" \
            -o GTA5Webport.zip

          test -s GTA5Webport.zip

          echo "Downloaded archive:"
          ls -lh GTA5Webport.zip

          unzip -tq GTA5Webport.zip

      - name: Extract Game Data
        run: |
          set -e

          mkdir -p "$SOURCE_ROOT/app/Build/Inputs/mirror"

          unzip -q \
            "$RUNNER_TEMP/game/GTA5Webport.zip" \
            -d "$SOURCE_ROOT/app/Build/Inputs/mirror"

          echo "Extracted Game Data:"
          du -sh "$SOURCE_ROOT/app/Build/Inputs/mirror"
          find "$SOURCE_ROOT/app/Build/Inputs/mirror" \
            -maxdepth 3 -type f | head -50

      - name: Verify Game Files
        run: |
          cd "$SOURCE_ROOT/app"

          python3 Scripts/check_game_files.py \
            --mirror Build/Inputs/mirror

      - name: Prepare engine and generated sources
        run: |
          cd "$SOURCE_ROOT/app"

          python3 Scripts/prepare.py \
            --mirror Build/Inputs/mirror

      - name:
